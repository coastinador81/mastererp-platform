<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 40rem; line-height: 1.4; }
    input, button { font: inherit; padding: 0.4rem 0.5rem; }
    article { border-top: 1px solid #ddd; padding: 0.8rem 0; }
  </style>
</head>
<body>
  <h1 id="titulo">Tienda</h1>
  <p>
    <input id="host" placeholder="Host de la página">
    <button id="ver">Ver catálogo</button>
  </p>
  <div id="lista"></div>
  <script>
    const api = "https://client-api.dev.erp.uonify.com";
    const host = document.querySelector("#host");
    host.value = location.hostname.endsWith("amplifyapp.com") ? "" : location.hostname;
    document.querySelector("#ver").onclick = cargar;
    async function cargar() {
      const lista = document.querySelector("#lista");
      lista.textContent = "Cargando.";
      const response = await fetch(api + "/v1/tienda?host=" + encodeURIComponent(host.value.trim()));
      const data = await response.json();
      if (!response.ok) {
        lista.textContent = data.error || "No se pudo abrir la tienda.";
        return;
      }
      document.querySelector("#titulo").textContent = data.organizacion;
      lista.replaceChildren();
      for (const producto of data.productos) {
        const item = document.createElement("article");
        const pesos = (producto.precio_centavos / 100).toFixed(2);
        item.textContent = producto.nombre + " · " + producto.sku + " · $" + pesos + " · " + producto.cantidad + " en existencia";
        lista.appendChild(item);
      }
      if (!data.productos.length) lista.textContent = "Esta página todavía no tiene productos.";
    }
    if (host.value) cargar();
  </script>
</body>
</html>
