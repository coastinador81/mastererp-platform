<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 46rem; line-height: 1.4; }
    section { margin: 1.5rem 0; display: grid; gap: 0.5rem; }
    input, button { font: inherit; padding: 0.4rem 0.5rem; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 0.8rem; }
  </style>
</head>
<body>
  <h1>Portal de la organización</h1>
  <section>
    <input id="org" placeholder="Id de la organización">
    <button id="guardar">Usar esta organización</button>
  </section>
  <section>
    <h2>Producto</h2>
    <input id="sku" placeholder="SKU">
    <input id="nombre" placeholder="Nombre">
    <input id="precio" placeholder="Precio en centavos" inputmode="numeric">
    <input id="categoria" placeholder="Categoría">
    <button id="producto">Registrar producto</button>
  </section>
  <section>
    <h2>Existencia</h2>
    <input id="sku-stock" placeholder="SKU">
    <input id="cantidad" placeholder="Cantidad" inputmode="numeric">
    <button id="stock">Guardar existencia</button>
  </section>
  <section>
    <h2>Página</h2>
    <input id="host" placeholder="sol.store.dev.erp.uonify.com">
    <button id="pagina">Publicar página</button>
  </section>
  <section>
    <h2>Empleado</h2>
    <input id="empleado" placeholder="Nombre">
    <input id="puesto" placeholder="Puesto">
    <input id="sucursal" placeholder="Sucursal">
    <button id="alta-empleado">Registrar empleado</button>
  </section>
  <section>
    <h2>Acceso</h2>
    <input id="usuario" placeholder="Nombre">
    <input id="correo" placeholder="Correo">
    <input id="rol" placeholder="Rol, por ejemplo cajero">
    <button id="alta-usuario">Crear usuario</button>
  </section>
  <pre id="salida">Pega el id que entregó el alta.</pre>
  <script>
    const api = "https://admin-api.dev.erp.uonify.com";
    const salida = document.querySelector("#salida");
    const org = document.querySelector("#org");
    org.value = localStorage.getItem("organizacion") || "";
    document.querySelector("#guardar").onclick = () => {
      localStorage.setItem("organizacion", org.value.trim());
      cargar();
    };
    async function post(path, body) {
      const response = await fetch(api + path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ organizacion_id: org.value.trim(), ...body })
      });
      salida.textContent = JSON.stringify(await response.json(), null, 2);
    }
    async function cargar() {
      if (!org.value.trim()) return;
      const response = await fetch(api + "/v1/productos?organizacion_id=" + encodeURIComponent(org.value.trim()));
      const productos = await response.json();
      const empleados = await (await fetch(api + "/v1/empleados?organizacion_id=" + encodeURIComponent(org.value.trim()))).json();
      salida.textContent = JSON.stringify({ productos, empleados }, null, 2);
    }
    document.querySelector("#producto").onclick = () => post("/v1/productos", {
      sku: document.querySelector("#sku").value,
      nombre: document.querySelector("#nombre").value,
      precio_centavos: Number(document.querySelector("#precio").value),
      categoria: document.querySelector("#categoria").value
    });
    document.querySelector("#stock").onclick = () => post("/v1/inventario", {
      sku: document.querySelector("#sku-stock").value,
      cantidad: Number(document.querySelector("#cantidad").value)
    });
    document.querySelector("#pagina").onclick = () => post("/v1/paginas", { host: document.querySelector("#host").value });
    document.querySelector("#alta-empleado").onclick = () => post("/v1/empleados", {
      nombre: document.querySelector("#empleado").value,
      puesto: document.querySelector("#puesto").value,
      sucursal: document.querySelector("#sucursal").value
    });
    document.querySelector("#alta-usuario").onclick = () => post("/v1/usuarios", {
      nombre: document.querySelector("#usuario").value,
      correo: document.querySelector("#correo").value,
      rol: document.querySelector("#rol").value
    });
    cargar();
  </script>
</body>
</html>
