<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centro de agentes</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 40rem; line-height: 1.4; }
    form { display: grid; gap: 0.6rem; }
    textarea, button { font: inherit; padding: 0.4rem 0.5rem; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 0.8rem; }
  </style>
</head>
<body>
  <h1>Centro de agentes</h1>
  <p>El mensaje entra por agents-api. Este servicio no abre la base.</p>
  <form id="flujo">
    <textarea name="mensaje" rows="4" required placeholder="Qué debe hacer el agente"></textarea>
    <button>Enviar</button>
  </form>
  <pre id="salida">Sin envíos.</pre>
  <script>
    const api = "https://agents-api.dev.erp.uonify.com";
    document.querySelector("#flujo").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const response = await fetch(api + "/v1/flujos", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(data)
      });
      document.querySelector("#salida").textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>
