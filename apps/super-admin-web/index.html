<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alta de organizaciones</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 40rem; line-height: 1.4; }
    form, pre { display: grid; gap: 0.6rem; }
    input, button { font: inherit; padding: 0.4rem 0.5rem; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 0.8rem; }
  </style>
</head>
<body>
  <h1>Alta de organizaciones</h1>
  <p>Crea el tenant y deja activos catálogo, inventario, página web y empleados.</p>
  <form id="alta">
    <input name="nombre" placeholder="Nombre" required>
    <input name="slug" placeholder="slug, por ejemplo ferreteria-sol" required>
    <button>Crear organización</button>
  </form>
  <pre id="salida">Todavía no hay un alta.</pre>
  <script>
    const api = "https://admin-api.dev.erp.uonify.com";
    const salida = document.querySelector("#salida");
    document.querySelector("#alta").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const response = await fetch(api + "/v1/organizaciones", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(data)
      });
      salida.textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>
