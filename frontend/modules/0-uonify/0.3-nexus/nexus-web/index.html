<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus · Uonify</title>
  <link rel="license" href="/shared/Inter-OFL.txt">
  <style>
    @font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url('/shared/Inter-latin-variable.woff2') format('woff2')}
    :root{--blue:#096bdc;--ink:#374151;--text:#4b5563;--muted:#667085;--line:#e8edf3;--bg:#f6f8fc;--card:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 14px/1.5 Inter,system-ui,sans-serif;padding:24px}
    main{max-width:560px;width:100%;padding:48px 40px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center;box-shadow:0 8px 24px #2338520f}
    h1{margin:0;color:var(--ink);font-size:34px;font-weight:500;letter-spacing:-.5px}
    .sub{margin:10px 0 0;color:var(--muted);font-size:13px}
    .hello{margin:32px 0 12px;color:var(--blue);font-size:22px;font-weight:500}
    .lead{margin:0;color:var(--text);font-size:16px}
    footer{margin-top:28px;font-size:12px;color:var(--muted)}
    a:focus-visible,main:focus{outline:2px solid #2563eb;outline-offset:4px}
  </style>
</head>
<body>
  <main id="content" tabindex="-1">
    <h1>Nexus</h1>
    <p class="sub">MasterERP · Desarrollo</p>
    <p class="hello">Hola mundo</p>
    <p class="lead">Centro transversal de integraciones y proveedores</p>
    <footer>Publicado desde mastererp-platform · sin integraciones activas</footer>
  </main>
</body>
</html>
