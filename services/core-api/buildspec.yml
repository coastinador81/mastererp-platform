version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 277352717693.dkr.ecr.us-west-2.amazonaws.com
  build:
    commands:
      - docker build -f mastererp-platform/services/core-api/Dockerfile -t mastererp-api .
      - |
        for name in admin-api client-api agents-api mcp; do
          docker tag mastererp-api 277352717693.dkr.ecr.us-west-2.amazonaws.com/mastererp/$name:skeleton
          docker push 277352717693.dkr.ecr.us-west-2.amazonaws.com/mastererp/$name:skeleton
        done
artifacts:
  files: []
