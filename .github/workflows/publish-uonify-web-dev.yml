name: Publish Uonify web (dev.uonify.com)
# Web de Uonify (frontend/modules/0-uonify/0.2-app) y su puerta en https://dev.uonify.com.
# - push a dev: SOLO ENSAYO (build, puerta generada para ese dist, pruebas offline y plan de cambios).
# - publicar de verdad: lanzarlo a mano en dev con «publicar» marcado, tras el OK visual del Product Owner.
# Rol: uonify-dev-web-github-role (mastererp-infrastructure modules/0-uonify/0.2-app/resources.yml).
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/modules/0-uonify/0.2-app/**'
      - 'backend/modules/0-uonify/0.2-app/app/**'
      - '.github/workflows/publish-uonify-web-dev.yml'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar de verdad en dev.uonify.com (sin marcar: solo ensayo)'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: uonify-dev-web
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP: frontend/modules/0-uonify/0.2-app
      APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar && github.ref == 'refs/heads/dev' }}
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/modules/0-uonify/0.2-app/package-lock.json
      - name: Dependencias
        working-directory: ${{ env.APP }}
        run: npm ci --no-audit --no-fund --loglevel=error
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::277352717693:role/uonify-dev-web-github-role
          aws-region: us-east-1
      - name: Cuenta AWS esperada
        run: test "$(aws sts get-caller-identity --query Account --output text)" = 277352717693
      - name: Media de más de 1 MiB desde el bucket (comprobada por sha256)
        working-directory: ${{ env.APP }}
        run: |
          set -euo pipefail
          while read -r sum rel; do
            mkdir -p "$(dirname "$rel")"
            aws s3api get-object --bucket uonify-dev-web-277352717693 --key "${rel#public/}" "$rel" > /dev/null
          done < media-fuera-de-git.sha256
          sha256sum -c --quiet media-fuera-de-git.sha256
      - name: Build de DEV (sin mocks, noindex)
        working-directory: ${{ env.APP }}
        run: |
          unset VITE_USE_MOCKS VITE_INDEXING VITE_ESTUDIO_CLIP_WIRING
          VITE_SITE_URL=https://dev.uonify.com npm run build
      - name: Puerta generada para este dist y pruebas offline
        working-directory: ${{ env.APP }}
        env:
          GATE_DIST: ${{ github.workspace }}/frontend/modules/0-uonify/0.2-app/dist
          GATE_FRONT_SRC: ${{ github.workspace }}/frontend/modules/0-uonify/0.2-app/src
          GATE_BACKEND_SRC: ${{ github.workspace }}/backend/modules/0-uonify/0.2-app/app
          GATE_ACORN: ${{ github.workspace }}/frontend/modules/0-uonify/0.2-app/node_modules/acorn
        run: |
          node edge/build_gate.mjs --dist dist --root-gated --write
          node edge/test_gate.mjs
      - name: Plan (solo lectura)
        working-directory: ${{ env.APP }}
        run: |
          node edge/upload_dist.mjs --dist dist
          node edge/upload_dist.mjs --dist dist --root
          node edge/deploy_edge.mjs legal
          node edge/ci_gate.mjs plan
      - name: Publicar web, puerta y páginas legales
        if: env.APPLY == 'true'
        working-directory: ${{ env.APP }}
        run: |
          node edge/upload_dist.mjs --dist dist --apply
          node edge/ci_gate.mjs publish --backup "$RUNNER_TEMP/puerta-live-anterior"
          node edge/upload_dist.mjs --dist dist --root --apply
          node edge/deploy_edge.mjs legal --apply
      - name: Verificar de punta a punta (sin credenciales)
        id: verify
        if: env.APPLY == 'true'
        working-directory: ${{ env.APP }}
        run: node edge/deploy_edge.mjs verify
      - name: Volver a la puerta anterior si algo falla al publicar
        if: failure() && env.APPLY == 'true'
        working-directory: ${{ env.APP }}
        run: node edge/ci_gate.mjs rollback --from "$RUNNER_TEMP/puerta-live-anterior"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puerta-generada
          path: |
            frontend/modules/0-uonify/0.2-app/edge/gate-default.js
            frontend/modules/0-uonify/0.2-app/edge/public-pages
          retention-days: 14
