name: Quality and security

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python unit and handler tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade pip
          pytest coverage psycopg[binary] boto3 PyJWT[crypto]
      - name: Run unit, handler and domain tests
        env:
          PYTHONPATH: backend/shared/tenant-security:backend/modules/1.0-platform-base/1.1-tenant-onboarding:backend/modules/0-uonify/lambdas/uonify-google-connection-handler:backend/modules/2.1-catalog/2.1.1-products:backend/modules/2.1-catalog/2.1.2-categories:backend/modules/2.1-catalog/2.1.3-attributes:backend/modules/2.1-catalog/2.1.4-brands:backend/modules/2.1-catalog/2.1.5-suppliers:backend/modules/2.1-catalog/2.1.6-inventory:backend/modules/2.3-operations/2.3.1-orders:backend/modules/2.3-operations/2.3.2-preparation:backend/modules/2.3-operations/2.3.3-routes:backend/modules/2.3-operations/2.3.4-nodes:backend/modules/2.4-digital-sales/2.4.2-ecommerce:backend/modules/2.10-transport/2.10.1-drivers:backend/modules/2.2-finance/2.2.1-administration/shared
        run: >-
          python -m coverage run -m pytest --import-mode=importlib
          backend/shared/tenant-security/tests
          backend/modules/1.0-platform-base/1.1-tenant-onboarding/tests
          backend/modules/0-uonify/lambdas/uonify-google-connection-handler
          backend/modules/2.1-catalog
          backend/modules/2.3-operations
          backend/modules/2.4-digital-sales
          backend/modules/2.10-transport
          backend/modules/2.2-finance/2.2.1-administration/shared/test_purchases.py
          -m 'not integration' -q
      - name: Enforce minimum line coverage
        run: python -m coverage report --fail-under=60
      - name: Static syntax analysis
        run: python -m compileall -q backend

  frontend:
    name: Frontend unit tests and builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application:
          - frontend/modules/0-uonify
          - frontend/modules/2.2-finance
          - frontend/storefront-web
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - run: npm ci
      - run: node --test ../../shared/auth/cognito.test.mjs
        if: matrix.application == 'frontend/modules/0-uonify' || matrix.application == 'frontend/modules/2.2-finance'
      - run: npm run build

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_structure.py
      - run: git diff --check HEAD~1 HEAD
