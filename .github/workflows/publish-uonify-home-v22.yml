name: Publish Uonify home-v22 DEV
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'frontend/modules/0-uonify/0.2-app/web/home-v22-propuesta/**'
      - '.github/workflows/publish-uonify-home-v22.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mastererp-dev-uonify-home-v22
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::277352717693:role/mastererp-dev-uonify-frontend-github-role
          aws-region: us-west-1
      - name: Publish home-v22-propuesta to dev.uonify.com
        env:
          BUCKET: ${{ vars.UONIFY_DEV_BUCKET }}
          DISTRIBUTION: ${{ vars.UONIFY_DEV_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" && test -n "$DISTRIBUTION"
          SRC=frontend/modules/0-uonify/0.2-app/web/home-v22-propuesta
          PREFIX=web/home-v22-propuesta
          aws s3 cp "$SRC/index.html" "s3://$BUCKET/$PREFIX/index.html" \
            --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,max-age=0,must-revalidate'
          aws s3 cp "$SRC/module-launcher.mjs" "s3://$BUCKET/$PREFIX/module-launcher.mjs" \
            --content-type 'text/javascript; charset=utf-8' --cache-control 'public,max-age=300'
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/$PREFIX/index.html" "/$PREFIX/module-launcher.mjs" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$invalidation"
