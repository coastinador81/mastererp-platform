name: Publish Finance frontend DEV
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'frontend/modules/2.2-finance/index.html'
      - 'frontend/modules/2.2-finance/src/**'
      - 'frontend/modules/2.2-finance/package*.json'
      - 'frontend/modules/2.2-finance/.env.dev'
      - 'frontend/modules/2.2-finance/.gitattributes'
      - '.github/workflows/publish-finance-dev.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: mastererp-dev-finance-frontend
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/modules/2.2-finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/modules/2.2-finance/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::277352717693:role/mastererp-dev-finance-frontend-github-role
          aws-region: us-west-1
      - name: Publish immutable assets then entry point
        env:
          BUCKET: ${{ vars.FINANCE_DEV_BUCKET }}
          DISTRIBUTION: ${{ vars.FINANCE_DEV_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" && test -n "$DISTRIBUTION"
          test "$(aws sts get-caller-identity --query Account --output text)" = 277352717693
          aws s3 sync dist/ "s3://$BUCKET/" --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,max-age=0,must-revalidate'
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths / /index.html --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$invalidation"
