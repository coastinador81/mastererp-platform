name: Publish Storefront DEV

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: storefront-dev
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    environment: storefront-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/storefront-web/package-lock.json
      - name: Install and verify
        working-directory: frontend/storefront-web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build:dev
      - name: Configure hosting credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::941751053509:role/mastererp-dev-storefront-publisher
          aws-region: us-west-2
      - name: Publish immutable assets
        run: aws s3 sync frontend/storefront-web/dist s3://tmi-dev-client --exclude index.html --cache-control 'public,max-age=31536000,immutable'
      - name: Publish entry point last
        run: aws s3 cp frontend/storefront-web/dist/index.html s3://tmi-dev-client/index.html --cache-control 'no-cache,no-store,must-revalidate'
      - name: Invalidate and smoke
        run: |
          aws cloudfront create-invalidation --distribution-id E2PLU72V9YKM01 --paths '/*'
          curl --fail --retry 5 --retry-delay 5 https://tienda-dev.tumandaito.com/
