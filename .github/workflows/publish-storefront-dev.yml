name: Publish Storefront DEV
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'frontend/modules/2.4-digital-sales/2.4.2-ecommerce/storefront/**'
      - 'frontend/shared/auth/**'
      - '.github/workflows/publish-storefront-dev.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: mastererp-dev-storefront-frontend
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/modules/2.4-digital-sales/2.4.2-ecommerce/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/modules/2.4-digital-sales/2.4.2-ecommerce/storefront/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build Expo web export
        env:
          EXPO_PUBLIC_STOREFRONT_API_URL: https://btqqku792c.execute-api.us-west-1.amazonaws.com
          EXPO_PUBLIC_STOREFRONT_DOMAIN: tienda-dev.uonify.com
          EXPO_PUBLIC_TENANT_ID: ${{ vars.STOREFRONT_DEV_TENANT_ID }}
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::277352717693:role/mastererp-dev-storefront-frontend-github-role
          aws-region: us-west-1
      - name: Publish dist to S3 and invalidate CloudFront
        env:
          BUCKET: ${{ vars.STOREFRONT_UONIFY_BUCKET }}
          DISTRIBUTION: ${{ vars.STOREFRONT_UONIFY_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" && test -n "$DISTRIBUTION"
          test "$(aws sts get-caller-identity --query Account --output text)" = 277352717693
          aws s3 sync dist/ "s3://$BUCKET/" --exclude index.html --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://$BUCKET/auth/callback" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,max-age=0,must-revalidate'
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache,max-age=0,must-revalidate'
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$invalidation"
